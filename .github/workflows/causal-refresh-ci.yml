name: causal-refresh-ci

on:
  push:
    paths:
      - "causal_refresh.py"
      - "test_causal_refresh.py"
      - ".github/workflows/causal-refresh-ci.yml"
  pull_request:
    paths:
      - "causal_refresh.py"
      - "test_causal_refresh.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest test_causal_refresh -v
